<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="style.css" type="text/css">
    </head>

    <body>
        <div class="w-100 vh-100 " id="bg">
            <div class="w-50 position-absolute top-50 start-50 translate-middle rounded-4 p-4 d-flex flex-column justify-content-between" style="min-height: 450px; width: 450px; background-color: rgba(7, 7, 39, 0.795);">
                <h1>Welcome to <span class="banner"><br>Quiz</span></h1>
                <h2 class="text-center text-white mt-3">Start Quiz .</h2>
                <h3 class=" text-white fs-3" id="Qustion"></h3>
                <ul class="text-white fs-4 list-unstyled ps-2 " id="Option">
                </ul>
                <div class="btn d-flex justify-content-between">
                    <button type="button" id="prevBtn" class="myButton btn btn-primary fs-5" onclick="prevQustion();">prev</button>
                    <button type="button"id="nextBtn" class="myButton btn btn-primary fs-5" onclick="nextQustion();">next</button>
                </div>
                <div class="cover text-center text-white">
                    <h2>Timer:- <span id="timer"></span></h2>
                </div>
            </div>
        </div>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="./js/script.js"></script>
    </body>
</html>
